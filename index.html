<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>TON Coin Master | Telegram Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-bg: #0d1117;
            --secondary-bg: #161b22;
            --text-color: #f0f6fc;
            --coin-gold: #f5b041;
            --energy-color: #34d399;
            --accent-blue: #228be6;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            padding: 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .app-title { font-size: 14px; font-weight: bold; color: rgba(255, 255, 255, 0.5); letter-spacing: 1px; }
        .score-container {
            font-size: 40px;
            font-weight: 800;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .ton-icon { width: 36px; height: 36px; }

        /* Main Game Area */
        .game-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .coin-wrapper {
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .coin {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #5dade2, #2471a3 80%);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(36, 113, 163, 0.4), inset 0 -5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            transition: transform 0.05s ease-out;
            user-select: none;
        }

        /* Coin Tap Animation */
        .coin-wrapper:active .coin { transform: scale(0.95); }

        /* Floating Score Text (+1) */
        .floating-score {
            position: absolute;
            color: #5dade2;
            font-size: 28px;
            font-weight: bold;
            opacity: 1;
            pointer-events: none;
            animation: scoreUp 0.8s ease-out forwards;
        }

        @keyframes scoreUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        /* Energy Bar */
        .energy-section {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .energy-bar-container {
            width: 100%;
            height: 10px;
            background-color: #2a333f;
            border-radius: 5px;
            overflow: hidden;
        }
        .energy-bar-fill {
            height: 100%;
            background-color: var(--energy-color);
            width: 100%;
            transition: width 0.1s linear;
        }
        .energy-text {
            font-size: 14px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Bottom Nav */
        .bottom-nav {
            background-color: var(--secondary-bg);
            padding: 12px 10px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-item {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex: 1;
        }
        .nav-item.active { color: var(--accent-blue); font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Score Section -->
    <div class="top-bar">
        <div class="app-title" id="user-title">TON COIN MASTER</div>
        <div class="score-container">
            <span id="score">0</span>
        </div>
    </div>

    <!-- Main Click Area -->
    <div class="game-area" id="game-area">
        <div class="coin-wrapper" id="coin-btn">
            <div class="coin">💎</div>
        </div>
    </div>

    <!-- Energy & Bottom Nav Area -->
    <div>
        <div class="energy-section">
            <div class="energy-text">⚡ <span id="energy-current">1000</span> / 1000</div>
            <div class="energy-bar-container">
                <div class="energy-bar-fill" id="energy-bar"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="#" class="nav-item active"><div>Tap</div></a>
            <a href="#" class="nav-item"><div>Friends</div></a>
            <a href="#" class="nav-item"><div>Tasks</div></a>
            <a href="#" class="nav-item"><div>Leaderboard</div></a>
            <a href="#" class="nav-item"><div>Airdrop</div></a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation(); 

        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;
        const energyRecoveryRate = 2; 

        const scoreDisplay = document.getElementById('score');
        const coinBtn = document.getElementById('coin-btn');
        const gameArea = document.getElementById('game-area');
        const energyCurrentDisplay = document.getElementById('energy-current');
        const energyBar = document.getElementById('energy-bar');

        // User Name එක Telegram එකෙන් ගැනීම
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-title').innerText = `${tg.initDataUnsafe.user.first_name.toUpperCase()}'S COIN MASTER`;
        }

        // Click Logic
        coinBtn.addEventListener('click', (e) => {
            if (energy > 0) {
                score++;
                scoreDisplay.innerText = score;

                energy--;
                updateEnergyUI();

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

                createFloatingScore(e.clientX, e.clientY);
            } else {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('warning');
                }
                tg.showAlert("Energy ඉවරයි! ටිකක් වෙලාවකින් ආයෙ පිරෙයි.");
            }
        });

        // Floating Score Function
        function createFloatingScore(x, y) {
            const scoreText = document.createElement('div');
            scoreText.className = 'floating-score';
            scoreText.innerText = '+1';
            
            // Touch කරපු තැනට අනුව Text එක සෙට් කිරීම
            const rect = gameArea.getBoundingClientRect();
            const clickX = x ? x - rect.left : rect.width / 2;
            const clickY = y ? y - rect.top : rect.height / 2;

            scoreText.style.left = `${clickX}px`;
            scoreText.style.top = `${clickY}px`;

            gameArea.appendChild(scoreText);

            setTimeout(() => {
                scoreText.remove();
            }, 800);
        }

        // Energy UI Update Function
        function updateEnergyUI() {
            energyCurrentDisplay.innerText = energy;
            const energyPercentage = (energy / maxEnergy) * 100;
            energyBar.style.width = `${energyPercentage}%`;
        }

        // Energy Refill Logic (තත්පරයකට වරක් පිරීම)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + energyRecoveryRate);
                updateEnergyUI();
            }
        }, 1000);
    </script>
</body>
</html>
